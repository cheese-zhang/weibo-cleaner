name: Weibo Cleanup

on:
  workflow_dispatch:
    inputs:
      since:
        description: "起始日期 YYYY-MM-DD（可空）"
        required: false
      until:
        description: "结束日期 YYYY-MM-DD（可空）"
        required: false
      confirm:
        description: "真正删除（默认仅预览）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run cleanup
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          WEIBO_UID: ${{ secrets.WEIBO_UID }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          umask 077
          printf '%s' "$WEIBO_COOKIE" > "$RUNNER_TEMP/cookie.txt"
          args=(--uid "$WEIBO_UID" --cookie-file "$RUNNER_TEMP/cookie.txt")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          [ -n "$UNTIL" ] && args+=(--until "$UNTIL")
          [ "$CONFIRM" = "true" ] && args+=(--confirm)
          python weibo_cleanup.py "${args[@]}"
          rm -f "$RUNNER_TEMP/cookie.txt"
